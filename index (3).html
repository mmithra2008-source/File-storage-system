<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud-Based File Storage System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; font-size: 16px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .file-list { margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 4px; border: 1px solid #ddd; }
        ul { padding-left: 20px; margin: 0; }
        li { margin-bottom: 8px; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h2>Cloud File Storage System</h2>
    
    <label style="font-weight: bold; color: #555;">Choose File to Upload:</label>
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload File</button>

    <h3>Stored Files</h3>
    <div id="fileList" class="file-list">No files uploaded yet.</div>
</div>

<script>
    let cloudStorage = [];

    function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        
        if (fileInput.files.length === 0) {
            alert("Please select a file first!");
            return;
        }

        // FIX: Extracting the correct file name from the uploaded file object
        const fileName = fileInput.files[0].name;
        
        cloudStorage.push(fileName);
        alert("✔ Success: " + fileName + " uploaded successfully!");
        
        displayFiles();
        fileInput.value = ""; // Reset input slot
    }

    function displayFiles() {
        const fileListDiv = document.getElementById('fileList');
        if (cloudStorage.length === 0) {
            fileListDiv.innerHTML = "No files uploaded yet.";
        } else {
            fileListDiv.innerHTML = "<ul>" + cloudStorage.map(file => `<li>📄 ${file}</li>`).join('') + "</ul>";
        }
    }
</script>

</body>
</html>
